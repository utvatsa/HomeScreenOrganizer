[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "HomeScreenOrganizer"
version = "1.0.0"
description = "HomeScreenOrganizer — Autonomous, declarative Android home screen management, design, and automation system for Samsung One UI Home"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=12.0.0",
  "numpy>=2.0.0",
  "pydantic>=2.10.0",
  "click>=8.1.0",
  "uiautomator2>=3.5.0",
  "opencv-python-headless>=4.10.0",
  "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
homescreenorganizer = "automation.cli:main"

[tool.setuptools.packages.find]
include = ["automation*"]
